optimism_package:
  chains:
    - participants:
      - el_type: op-geth
        el_image: {{ localDockerImage "op-geth" }}
        el_log_level: ""
        el_extra_env_vars: {}
        el_extra_labels: {}
        el_extra_params:
        - "--rpc.txfeecap=0"
        - "--txpool.nolocals"
        el_tolerations: []
        el_volume_size: 0
        el_min_cpu: 0
        el_max_cpu: 0
        el_min_mem: 0
        el_max_mem: 0
        cl_type: op-node
        cl_image: {{ localDockerImage "op-node" }}
        cl_log_level: ""
        cl_extra_env_vars: {}
        cl_extra_labels: {}
        cl_extra_params:
        - "--sequencer.use-finalized=true"
        - "--safedb.path=/safe-db"
        cl_tolerations: []
        cl_volume_size: 0
        cl_min_cpu: 0
        cl_max_cpu: 0
        cl_min_mem: 0
        cl_max_mem: 0
        node_selectors: {}
        tolerations: []
        count: 1
      network_params:
        network: "kurtosis"
        network_id: "42220"
        seconds_per_slot: 2
        name: "op-kurtosis"
        fjord_time_offset: 0
        granite_time_offset: 0
        holocene_time_offset: 0
        isthmus_time_offset: 0
        fund_dev_accounts: true
        deploy_celo_contracts: true
        use_custom_gas_token: true
      batcher_params:
        image: {{ localDockerImage "op-batcher" }}
        extra_params: ["--batch-type=1"]
      challenger_params:
        image: {{ localDockerImage "op-challenger" }}
        cannon_prestate_path: ""
        cannon_prestates_url: {{ localPrestate.URL }}
        extra_params: []
      proposer_params:
        image: {{ localDockerImage "op-proposer" }}
        extra_params: []
        game_type: 1
        proposal_interval: 10m
      mev_params:
        rollup_boost_image: ""
        builder_host: ""
        builder_port: ""
      da_server_params:
        maintenance: false
        image_proxy: {{ localDockerImage "da-proxy" }}
      additional_services:
      - "da_server"
  op_contract_deployer_params:
    image: {{ localDockerImage "op-deployer" }}
    image_inspect: {{ localDockerImage "op-deployer-inspect" }}
    l1_artifacts_locator: {{ localContractArtifacts "l1" }}
    l2_artifacts_locator: {{ localContractArtifacts "l2" }}
    global_deploy_overrides:
      faultGameAbsolutePrestate: {{ localPrestate.Hashes.prestate }}
  altda_deploy_config:
    use_altda: true
    da_commitment_type: KeccakCommitment
    da_challenge_window: 100
    da_resolve_window: 100
    da_bond_size: 0
    da_resolver_refund_percentage: 0
  global_log_level: "info"
  global_node_selectors: {}
  global_tolerations: []
  persistent: false
ethereum_package:
  participants:
    - el_type: geth
      el_extra_params:
      - "--miner.gasprice=1"
      cl_type: teku
  network_params:
    preset: minimal
    genesis_delay: 5
    additional_preloaded_contracts: |
      {
        "0x4e59b44847b379578588920cA78FbF26c0B4956C": {
          "balance": "0ETH",
          "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3",
          "storage": {},
          "nonce": "1"
        }
      }
