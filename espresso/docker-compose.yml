# Espresso compose devnet: L1 (anvil), an OP Stack L2 with the Espresso batcher
# and a fallback batcher, the Espresso dev node, and EigenDA in memstore mode.
#
# Usage, from the repository root:
#   just build-contracts
#   espresso/devnet/prepare.sh                  # writes espresso/deployment/
#   docker compose -f espresso/docker-compose.yml up -d
#
# Profiles:
#   (none)    the core devnet, enough for the espresso/devnet-tests harness
#   proofs    op-succinct fault proofs (fdg-deployer, proposer, challenger)
#   explorer  Blockscout on the sequencer, at http://localhost:3000
#
# The espresso/devnet-tests harness drives this file; see its package doc.

x-op-geth: &op-geth
  image: op-geth:espresso
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:${OP_HTTP_PORT}"]
    interval: 3s
    timeout: 2s
    retries: 40
  depends_on:
    l2-genesis:
      condition: service_completed_successfully
  environment:
    OP_HTTP_PORT: ${OP_HTTP_PORT}
    OP_ENGINE_PORT: ${OP_ENGINE_PORT}
    L2_CHAIN_ID: ${L2_CHAIN_ID}

x-op-node: &op-node
  image: op-node:espresso
  volumes:
    - l2-config:/config:ro

x-op-node-env: &op-node-env
  OP_NODE_L1_ETH_RPC: http://l1-anvil:${L1_HTTP_PORT}
  OP_NODE_L1_BEACON_IGNORE: "true"
  OP_NODE_L1_HTTP_POLL_INTERVAL: 1s
  OP_NODE_L1_EPOCH_POLL_INTERVAL: 1s
  OP_NODE_L2_ENGINE_AUTH: /config/jwt.txt
  OP_NODE_ROLLUP_CONFIG: /config/rollup.json
  OP_NODE_RPC_ADDR: 0.0.0.0
  OP_NODE_P2P_DISABLE: "true"
  OP_NODE_ALTDA_ENABLED: "true"
  OP_NODE_ALTDA_DA_SERVICE: "true"
  OP_NODE_ALTDA_VERIFY_ON_READ: "false"
  OP_NODE_ALTDA_DA_SERVER: http://eigenda-proxy:3100

x-op-batcher: &op-batcher
  image: op-batcher:espresso
  depends_on:
    op-node-sequencer:
      condition: service_healthy

x-op-batcher-env: &op-batcher-env
  OP_BATCHER_L1_ETH_RPC: http://l1-anvil:${L1_HTTP_PORT}
  OP_BATCHER_L2_ETH_RPC: http://op-geth-sequencer:${OP_HTTP_PORT}
  OP_BATCHER_ROLLUP_RPC: http://op-node-sequencer:${ROLLUP_PORT}
  OP_BATCHER_THROTTLE_UNSAFE_DA_BYTES_LOWER_THRESHOLD: "0"
  OP_BATCHER_MAX_CHANNEL_DURATION: "2"
  OP_BATCHER_TARGET_NUM_FRAMES: "1"
  OP_BATCHER_MAX_PENDING_TX: "32"
  OP_BATCHER_DATA_AVAILABILITY_TYPE: calldata
  OP_BATCHER_RPC_ENABLE_ADMIN: "true"

services:
  # L1. Anvil serves both the execution JSON-RPC and the beacon API, and with
  # one slot per epoch finalizes head - 2, so L1 finality takes seconds. It
  # continues the chain that espresso/devnet/prepare.sh deployed the contracts on.
  l1-anvil:
    image: ${ANVIL_IMAGE}
    healthcheck:
      test: ["CMD-SHELL", "cast bn --rpc-url http://localhost:${L1_HTTP_PORT} > /dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 40
    entrypoint: ["sh", "-c"]
    command:
      - |
        exec anvil \
          --silent \
          --host 0.0.0.0 \
          --port ${L1_HTTP_PORT} \
          --chain-id ${L1_CHAIN_ID} \
          --block-time 3 \
          --slots-in-an-epoch 1 \
          --load-state /config/state.json \
          --disable-code-size-limit \
          --base-fee 1000000000 \
          --gas-limit 45000000
    volumes:
      - ./deployment/l1-config:/config:ro
    ports:
      - "${L1_HTTP_PORT}:${L1_HTTP_PORT}"

  # One-shot: copy the L2 genesis into l2-config with a fresh timestamp.
  l2-genesis:
    <<: *op-geth
    pull_policy: never # built by op-geth-sequencer
    healthcheck:
      disable: true
    depends_on:
      l1-anvil:
        condition: service_healthy
    environment:
      MODE: genesis
      L1_RPC: http://l1-anvil:${L1_HTTP_PORT}
    volumes:
      - l2-config:/config
      - ./deployment/l2-config:/deployment/l2-config:ro

  # One-shot: copy the rollup config into l2-config, pointed at the live L2 genesis.
  l2-rollup:
    <<: *op-geth
    pull_policy: never # built by op-geth-sequencer
    healthcheck:
      disable: true
    depends_on:
      op-geth-sequencer:
        condition: service_healthy
    environment:
      MODE: rollup
      OP_RPC: http://op-geth-sequencer:${OP_HTTP_PORT}
    volumes:
      - l2-config:/config
      - ./deployment/l2-config:/deployment/l2-config:ro

  op-geth-sequencer:
    <<: *op-geth
    build:
      context: ../
      dockerfile: espresso/devnet/op-geth/Dockerfile
    volumes:
      - l2-config:/config:ro
      - op-geth-sequencer:/data
    ports:
      - "${OP_HTTP_PORT}:${OP_HTTP_PORT}"

  op-geth-verifier:
    <<: *op-geth
    pull_policy: never # built by op-geth-sequencer
    volumes:
      - l2-config:/config:ro
      - op-geth-verifier:/data
    ports:
      - "8547:${OP_HTTP_PORT}"

  op-node-sequencer:
    <<: *op-node
    build:
      context: ../
      dockerfile: ops/docker/op-stack-go/Dockerfile
      target: op-node-target
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${ROLLUP_PORT}"]
      interval: 3s
      timeout: 2s
      retries: 40
    depends_on:
      l2-rollup:
        condition: service_completed_successfully
      eigenda-proxy:
        condition: service_healthy
    environment:
      <<: *op-node-env
      OP_NODE_L2_ENGINE_RPC: http://op-geth-sequencer:${OP_ENGINE_PORT}
      OP_NODE_RPC_PORT: ${ROLLUP_PORT}
      OP_NODE_SEQUENCER_ENABLED: "true"
      OP_NODE_SEQUENCER_USE_FINALIZED: "true"
      OP_NODE_SAFEDB_PATH: /data/safedb
    volumes:
      - l2-config:/config:ro
      - op-node-sequencer:/data
    ports:
      - "${ROLLUP_PORT}:${ROLLUP_PORT}"

  op-node-verifier:
    <<: *op-node
    pull_policy: never # built by op-node-sequencer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${VERIFIER_PORT}"]
      interval: 3s
      timeout: 2s
      retries: 40
    depends_on:
      l2-rollup:
        condition: service_completed_successfully
      op-geth-verifier:
        condition: service_healthy
      eigenda-proxy:
        condition: service_healthy
    environment:
      <<: *op-node-env
      OP_NODE_L2_ENGINE_RPC: http://op-geth-verifier:${OP_ENGINE_PORT}
      OP_NODE_RPC_PORT: ${VERIFIER_PORT}
    ports:
      - "${VERIFIER_PORT}:${VERIFIER_PORT}"

  # The Espresso batcher. Outside a Nitro enclave it has no attestation, so it
  # signs batches with the testing key (accepted by the mock TEE verifier that
  # op-deployer deploys) and never dials the attestation service.
  op-batcher:
    <<: *op-batcher
    build:
      context: ../
      dockerfile: ops/docker/op-stack-go/Dockerfile
      target: op-batcher-target
    depends_on:
      op-node-sequencer:
        condition: service_healthy
      espresso-dev-node:
        condition: service_started
    environment:
      <<: *op-batcher-env
      OP_BATCHER_PRIVATE_KEY: ${OP_BATCHER_PRIVATE_KEY:-${ESPRESSO_BATCHER_PRIVATE_KEY}}
      OP_BATCHER_ALTDA_ENABLED: "true"
      OP_BATCHER_ALTDA_DA_SERVICE: "true"
      OP_BATCHER_ALTDA_DA_SERVER: http://eigenda-proxy:3100
      OP_BATCHER_ESPRESSO_ENABLED: "true"
      OP_BATCHER_ESPRESSO_POLL_INTERVAL: 1s
      OP_BATCHER_ESPRESSO_QUERY_SERVICE_URL: http://espresso-dev-node:${ESPRESSO_SEQUENCER_API_PORT}
      OP_BATCHER_ESPRESSO_L1_URL: http://l1-anvil:${L1_HTTP_PORT}
      OP_BATCHER_ESPRESSO_LIGHT_CLIENT_ADDR: ${ESPRESSO_SEQUENCER_LIGHT_CLIENT_PROXY_ADDRESS}
      OP_BATCHER_ESPRESSO_TESTING_BATCHER_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY}
      OP_BATCHER_ESPRESSO_ESPRESSO_ATTESTATION_SERVICE: http://attestation-service.invalid
      # HotShot block 0 (genesis) has no finalized L1 block, which the
      # streamer rejects, so scan from block 1.
      OP_BATCHER_ESPRESSO_ORIGIN_HEIGHT_ESPRESSO: "1"

  # The fallback batcher, the SystemConfig batcher. Idle until a test switches
  # the BatchAuthenticator to it.
  op-batcher-fallback:
    <<: *op-batcher
    pull_policy: never # built by op-batcher
    environment:
      <<: *op-batcher-env
      OP_BATCHER_PRIVATE_KEY: ${FALLBACK_BATCHER_PRIVATE_KEY}
      OP_BATCHER_ESPRESSO_ENABLED: "false"

  eigenda-proxy:
    image: ghcr.io/layr-labs/eigenda-proxy:2.2.1
    platform: linux/amd64
    environment:
      EIGENDA_PROXY_MEMSTORE_ENABLED: "true"
      EIGENDA_PROXY_MEMSTORE_EXPIRATION: 25m0s
      PORT: "3100"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3100"]
      interval: 3s
      timeout: 2s
      retries: 40
    ports:
      - "${EIGENDA_PROXY_PORT}:3100"

  espresso-dev-node:
    image: ${ESPRESSO_DEV_NODE_IMAGE}
    # l2-genesis exits once L1 has a finalized block, so every HotShot block
    # after genesis references one.
    depends_on:
      l2-genesis:
        condition: service_completed_successfully
    env_file:
      - ./.env
    # Same settings as the enclave tests' dev node (espresso/enclave-tests).
    environment:
      RUST_LOG: warn
      RUST_BACKTRACE: 1
      ESPRESSO_SEQUENCER_L1_PROVIDER: http://l1-anvil:${L1_HTTP_PORT}
      ESPRESSO_SEQUENCER_L1_POLLING_INTERVAL: 1s
      ESPRESSO_SEQUENCER_ETH_MNEMONIC: "giant issue aisle success illegal bike spike question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy very lucky have athlete"
      ESPRESSO_DEPLOYER_ACCOUNT_INDEX: 0
      ESPRESSO_SEQUENCER_STORAGE_PATH: /data/espresso
      ESPRESSO_DEV_NODE_VERSION: "0.4"
      # No epoch transitions: they need L1 staking events that the predeployed
      # allocs do not have.
      ESPRESSO_DEV_NODE_EPOCH_HEIGHT: "18446744073709551615"
    volumes:
      - espresso-data:/data
    ports:
      - "${ESPRESSO_SEQUENCER_API_PORT}:${ESPRESSO_SEQUENCER_API_PORT}"

  # Profile "proofs": op-succinct fault proofs in mock mode.

  # One-shot: deploy the OPSuccinctFaultDisputeGame (game type 42).
  fdg-deployer:
    profiles: ["proofs"]
    image: ghcr.io/espressosystems/op-succinct/op-succinct-fdg-deployer-celo:sha-075e0fe
    depends_on:
      op-node-sequencer:
        condition: service_healthy
    volumes:
      - ./deployment/deployer:/deployer:ro
    env_file:
      - ./deployment/deployer/succinct.env
    environment:
      L1_RPC: http://l1-anvil:${L1_HTTP_PORT}
      L2_RPC: http://op-geth-sequencer:${OP_HTTP_PORT}
      L2_NODE_RPC: http://op-node-sequencer:${ROLLUP_PORT}
      PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY}
      GAME_TYPE: "42"
      MAX_CHALLENGE_DURATION: "10"
      MAX_PROVE_DURATION: "60"
      FALLBACK_TIMEOUT_FP_SECS: "3600"
      INITIAL_BOND_WEI: "1000000000000000"
      CHALLENGER_BOND_WEI: "1000000000000000"
      DISPUTE_GAME_FINALITY_DELAY_SECONDS: "6"
      OP_SUCCINCT_MOCK: "true"
      PERMISSIONLESS_MODE: "true"
      ACTIVATE_CONTRACTS: "true"
      CONFIGURE_CONTRACTS: "true"
      STARTING_L2_BLOCK_NUMBER: "0"

  succinct-proposer:
    profiles: ["proofs"]
    image: ghcr.io/espressosystems/op-succinct/op-succinct-lite-proposer-celo:sha-075e0fe
    restart: unless-stopped
    depends_on:
      fdg-deployer:
        condition: service_completed_successfully
    volumes:
      - ./deployment/deployer:/deployer:ro
    env_file:
      - ./deployment/deployer/succinct.env
    environment:
      L1_RPC: http://l1-anvil:${L1_HTTP_PORT}
      L1_BEACON_RPC: http://l1-anvil:${L1_HTTP_PORT}
      L2_RPC: http://op-geth-sequencer:${OP_HTTP_PORT}
      L2_NODE_RPC: http://op-node-sequencer:${ROLLUP_PORT}
      PRIVATE_KEY: ${PROPOSER_PRIVATE_KEY}
      GAME_TYPE: "42"
      PROPOSAL_INTERVAL_IN_BLOCKS: "30"
      FETCH_INTERVAL: "1"
      MOCK_MODE: "true"
      USE_SAFE_HEAD_FOR_PROPOSALS: "false"
      RUST_LOG: info

  succinct-challenger:
    profiles: ["proofs"]
    image: ghcr.io/espressosystems/op-succinct/op-succinct-lite-challenger-celo:sha-075e0fe
    restart: unless-stopped
    depends_on:
      fdg-deployer:
        condition: service_completed_successfully
      op-node-verifier:
        condition: service_healthy
    volumes:
      - ./deployment/deployer:/deployer:ro
    env_file:
      - ./deployment/deployer/succinct.env
    environment:
      L1_RPC: http://l1-anvil:${L1_HTTP_PORT}
      L1_BEACON_RPC: http://l1-anvil:${L1_HTTP_PORT}
      L2_RPC: http://op-geth-verifier:${OP_HTTP_PORT}
      L2_NODE_RPC: http://op-node-verifier:${VERIFIER_PORT}
      PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY}
      GAME_TYPE: "42"
      FETCH_INTERVAL: "10"
      MOCK_MODE: "true"
      DISABLE_MONITOR_ONLY: "true"
      RUST_LOG: info

  # Profile "explorer": Blockscout, for local debugging only.

  blockscout-db:
    profiles: ["explorer"]
    image: postgres:14
    restart: on-failure
    environment:
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blockscout
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data

  blockscout:
    profiles: ["explorer"]
    image: ghcr.io/blockscout/blockscout@sha256:7659f168e4e2f6b73dd559ae5278fe96ba67bc2905ea01b57a814c68adf5a9dc
    restart: always
    depends_on:
      blockscout-db:
        condition: service_started
      op-geth-sequencer:
        condition: service_healthy
    command: >
      sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    environment:
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: http://op-geth-sequencer:${OP_HTTP_PORT}
      ETHEREUM_JSONRPC_WS_URL: ws://op-geth-sequencer:${OP_HTTP_PORT}
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      DATABASE_URL: postgresql://blockscout:password@blockscout-db:5432/blockscout?ssl=false
      ECTO_USE_SSL: "false"
      SECRET_KEY_BASE: "56NtB48ear7+wMSf0IQuWDAAazhpb31qyc7GiyspBP2vh7t5zlCsF5QDv76chXeN"
      CHAIN_ID: "${L2_CHAIN_ID}"
      API_V2_ENABLED: "true"
      MIX_ENV: "prod"
    ports:
      - "4000:4000"

  blockscout-frontend:
    profiles: ["explorer"]
    image: ghcr.io/blockscout/frontend@sha256:4b69f44148414b55c6b8550bc3270c63c9f99e923d54ef0b307e762af6bac90a
    restart: always
    depends_on:
      blockscout:
        condition: service_started
    environment:
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_APP_HOST: localhost
      NEXT_PUBLIC_APP_PORT: "3000"
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PORT: "4000"
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_API_BASE_PATH: "/"
      NEXT_PUBLIC_NETWORK_ID: "${L2_CHAIN_ID}"
      NEXT_PUBLIC_NETWORK_NAME: "Celo x Espresso devnet"
      NEXT_PUBLIC_NETWORK_RPC_URL: http://localhost:${OP_HTTP_PORT}
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Ether
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ETH
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
    ports:
      - "3000:3000"

volumes:
  l2-config:
  op-geth-sequencer:
  op-geth-verifier:
  op-node-sequencer:
  espresso-data:
  blockscout-db-data:
